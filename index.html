<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster Text Style</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap');

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Permanent Marker', cursive, sans-serif;
        }

        .poster {
            width: 320px;
            background-color: #e560a8; /* สีชมพูต้นฉบับ */
            padding: 30px 20px;
            border-radius: 8px;
            position: relative;
            color: #111;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        /* ข้อความเล็กๆ มุมขวาบน (www.L.C) */
        .top-right-text {
            position: absolute;
            top: 10px;
            right: 15px;
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 1px;
            opacity: 0.6;
        }

        /* สัญลักษณ์อัญประกาศเดี่ยวด้านซ้าย */
        .quote-mark {
            font-size: 80px;
            position: absolute;
            top: 40px;
            left: 30px;
            line-height: 0;
        }

        /* กลุ่มข้อความหลัก */
        .main-text {
            text-align: center;
            margin-top: 40px;
        }

        .main-text h1 {
            font-size: 38px;
            margin: 0;
            line-height: 1.1;
            letter-spacing: 2px;
        }

        /* ตัวขีดฆ่าคำว่า HEAVEN */
        .strike {
            position: relative;
            display: inline-block;
        }

        .strike::after {
            content: '';
            position: absolute;
            left: -8%;
            top: 50%;
            width: 116%;
            height: 5px;
            background-color: #d93838;
            transform: rotate(-2deg);
        }

        /* หน้ายิ้มข้างๆ */
        .smiley {
            position: absolute;
            right: 25px;
            bottom: 40px;
            font-size: 40px;
            transform: rotate(90deg);
        }
    </style>
</head>
<body>

    <div class="poster">
        <div class="top-right-text">www.L.C</div>
        <div class="quote-mark">’</div>
        
        <div class="main-text">
            <h1>HOT GIRL</h1>
            <h1>GO TO</h1>
            <h1><span class="strike">HEAVEN</span></h1>
        </div>

        <div class="smiley">:)</div>
    </div>

</body>
</html>
