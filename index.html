<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster Concept</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Prompt:wght@400;600&display=swap');

        .poster-container {
            width: 100%;
            max-width: 450px;
            height: 550px;
            background-color: #e560a8; /* สีชมพูโทนเดียวกับภาพ */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Permanent Marker', cursive, sans-serif;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 20px;
            box-sizing: border-box;
        }

        .text-line {
            font-size: 2.8rem;
            color: #1a1a1a;
            line-height: 1.2;
            letter-spacing: 2px;
            margin: 5px 0;
        }

        /* เอฟเฟกต์รอยขีดฆ่าสีแดง */
        .strike-through {
            position: relative;
            display: inline-block;
        }

        .strike-through::after {
            content: '';
            position: absolute;
            left: -5%;
            top: 50%;
            width: 110%;
            height: 6px;
            background-color: #d93838; /* สีแดงสำหรับขีดฆ่า */
            transform: rotate(-2deg);
            border-radius: 3px;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="poster-container">
        <div class="text-line">HOT GIRL</div>
        <div class="text-line">GO TO</div>
        <div class="text-line strike-through">HEAVEN</div>
    </div>

</body>
</html>
