<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4 in a row</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <h1>4 in a row (เรียง 4 ตัว)</h1>
    
    <div class="status-bar">
      <div id="current-player-display">
        ตานี้: <span id="player-indicator" class="player-dot red"></span>
      </div>
      <button onclick="resetGame()" class="reset-btn">🔄 เริ่มเกมใหม่</button>
    </div>

    <div id="winner-message" class="hidden"></div>

    <div id="game-area">
      <div id="buttons-layer"></div>
      <div id="board"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
